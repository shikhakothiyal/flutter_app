name: pulsesync_mobile
description: PulseSync Wearable Health Mobile Application for Android & iOS.
version: 1.0.0+1
publish_to: 'none'

environment:
  sdk: '>=3.0.0 <4.0.0'
  flutter: ">=3.10.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_reactive_ble: ^5.3.1
  provider: ^6.1.1
  sqflite: ^2.4.1
  path_provider: ^2.1.2
  fl_chart: ^0.68.0
  intl: ^0.19.0
  http: ^1.2.0
  uuid: ^4.3.3
  cupertino_icons: ^1.0.6

dependency_overrides:
  sqflite_android: 2.4.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
